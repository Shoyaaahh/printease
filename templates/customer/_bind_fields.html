<div class="row">
    <div class="col-md-6 mb-3">
        <label class="form-label">Paper Size</label>
        <select name="paper_size" class="form-select paper-size-input">
            <option value="" disabled {{ 'selected' if not form.get('paper_size') }}>Choose...</option>
            {% for size in paper_sizes %}
            <option value="{{ size }}" {{ 'selected' if form.get('paper_size') == size }}>{{ size }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-6 mb-3">
        <label class="form-label">Number of Pages</label>
        <input type="number" name="page_count" class="form-control page-count-input" min="1" value="{{ form.get('page_count', '') }}">
    </div>
</div>
<div class="form-check">
    <input class="form-check-input is-colored-input" type="checkbox" name="is_colored" {{ 'checked' if form.get('is_colored') == 'on' }}>
    <label class="form-check-label">Colored pages (unchecked = black &amp; white)</label>
</div>
